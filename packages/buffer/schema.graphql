"""
Aggregated post metrics across a filtered post set. Each entry in
`metrics` mirrors the shape of a `Post.metrics` entry; the total number
of matched posts is carried as a regular `PostMetric` entry with
`type: postCount`.
"""
type AggregatedPostMetrics {
  """
  Normalized metric aggregates across the matched posts. Always includes
  a baseline trio (`postCount`, `reactions`, `comments`) — posts on
  networks that don't track reactions or comments contribute 0 to those
  totals. Beyond the baseline, additional metric types are included only
  when every channel in the filter set supports them.
  """
  metrics: [PostMetric!]!

  """
  The latest `metricsUpdatedAt` across the matched posts, indicating the
  freshness of the aggregate. Metrics are refreshed daily, so values can
  be up to ~24h behind the source network. Null when no posts matched
  the filter.
  """
  metricsUpdatedAt: DateTime
}

"""
List of possible types for a Post. Some services may have different types (e.g., Instagram has story, reel, post but Twitter has only post)
"""
enum PostType {
  carousel
  event
  ghost_post
  offer
  post
  reel
  short
  story
  thread
  whats_new
}

"""
List of possible metrics available for a Post.

Values fall into three groups:
- **Cross-network normalized** (reactions, comments, shares, reposts, reach, impressions, views, clicks, engagementRate): Used wherever a concept maps cleanly across networks. Per-network adapters normalize their native names (e.g., Instagram `likes` → `reactions`, Twitter `retweets` → `reposts`).
- **Network-specific** (saves, follows, quotes, viewers, totalTimeWatched, averageTimeWatched, likes, freeSubscriptions, paidSubscriptions): Real metrics that don't have a cross-network equivalent. `likes` is intentionally distinct from `reactions` on Facebook — Facebook's Graph API surfaces them separately. `freeSubscriptions` and `paidSubscriptions` are Substack's per-Note subscription attribution; no other network reports it.
- **Aggregation-only** (postCount): Meaningful only on aggregate endpoints; never emitted per-post.

Deprecated values are pre-normalization legacy or tied to features being removed. They're kept in the enum for backwards compatibility until clients migrate.
"""
enum PostMetricType {
  """
  Average time watched, in seconds, for video-style posts (TikTok, Instagram Reels).
  """
  averageTimeWatched

  """How many times people clicked on your post."""
  clicks

  """
  The count of comments and replies on your post. Unified across networks (Threads `replies` maps here).
  """
  comments

  """
  The percentage of people who interacted with your post compared to how many saw it. Unit: percentage.
  """
  engagementRate

  """
  Deprecated: not emitted by any per-network definition. Use `reactions` instead — Twitter and Mastodon favorites normalize into `reactions`. Will be removed on 2026-12-01.
  """
  favorites @deprecated(reason: "Not emitted by any per-network definition; use `reactions` instead. Will be removed on 2026-12-01.")

  """The number of new followers gained from this post (Instagram)."""
  follows

  """The number of free subscriptions Substack attributes to this Note."""
  freeSubscriptions

  """
  How many times your post was shown on screen. May include multiple views by the same person — useful for spotting how often the content gets surfaced.
  """
  impressions

  """
  The Like-reaction subcount on Facebook. Distinct from `reactions` (which is the total of all reaction types — Like, Love, Care, Haha, Wow, Sad, Angry); Facebook's Graph API reports them separately and we mirror that.
  """
  likes

  """
  Deprecated: StartPage link-clicks metric. StartPage is being deprecated as a product. Will be removed on 2026-12-01.
  """
  link_clicks @deprecated(reason: "StartPage is being deprecated as a product. Will be removed on 2026-12-01.")

  """
  Deprecated catch-all from pre-normalization. Never emitted. Will be removed on 2026-12-01.
  """
  other @deprecated(reason: "Catch-all from pre-normalization; never emitted. Will be removed on 2026-12-01.")

  """The number of paid subscriptions Substack attributes to this Note."""
  paidSubscriptions

  """
  The count of posts included in an aggregated response. Only meaningful on aggregate endpoints — never emitted per-post.
  """
  postCount

  """How many times your post was quoted (Threads)."""
  quotes

  """The number of unique people who saw your post."""
  reach

  """
  How many people reacted to your post. Unified across networks: Instagram/Twitter `likes`, Mastodon `favorites`, etc. all map to this value.
  """
  reactions

  """
  Deprecated: not emitted by any per-network definition. Use `reposts` instead — Mastodon reblogs normalize into `reposts`. Will be removed on 2026-12-01.
  """
  reblogs @deprecated(reason: "Not emitted by any per-network definition; use `reposts` instead. Will be removed on 2026-12-01.")

  """
  Deprecated: not emitted by any per-network definition. Pre-normalization legacy from the Pinterest era. Will be removed on 2026-12-01.
  """
  repins @deprecated(reason: "Not emitted by any per-network definition. Will be removed on 2026-12-01.")

  """
  Deprecated: not emitted by any per-network definition. Use `comments` instead — replies are normalized into `comments` on the networks that distinguish them (Threads). Will be removed on 2026-12-01.
  """
  replies @deprecated(reason: "Not emitted by any per-network definition; use `comments` instead. Will be removed on 2026-12-01.")

  """
  How many times your post was reposted by others. Twitter `retweets`, Mastodon `reblogs`, Threads `reposts` all normalize to this value.
  """
  reposts

  """
  Deprecated: not emitted by any per-network definition. Use `reposts` instead — Twitter retweets normalize into `reposts`. Will be removed on 2026-12-01.
  """
  retweets @deprecated(reason: "Not emitted by any per-network definition; use `reposts` instead. Will be removed on 2026-12-01.")

  """
  How many times people saved your post (Instagram, Pinterest). A strong signal that the content is worth revisiting.
  """
  saves

  """How many times your post was shared or forwarded by others."""
  shares

  """
  Total time watched, in minutes, for video-style posts (LinkedIn, TikTok, Instagram Reels).
  """
  totalTimeWatched

  """Unique viewer count for video-style posts (LinkedIn)."""
  viewers

  """
  How many times your post was viewed. Used for video-style posts and on networks that report views distinctly from impressions.
  """
  views
}

"""The unit representing the value of a PostMetric."""
enum PostMetricUnit {
  """An integer count (e.g. number of reactions, impressions, reach)."""
  count

  """A percentage value between 0 and 100 (e.g. engagement rate)."""
  percentage
}

"""
A single metric for a post (or an entry in an aggregated metrics response).
"""
type PostMetric {
  """A human-readable description of what the metric represents."""
  description: String!

  """The human-readable name of the metric (e.g. "Reactions", "Eng. Rate")."""
  name: String!

  """
  The type of metric. Cross-network metrics use unified naming (`reactions`,
  `comments`, etc.); network-specific metrics retain their network's
  vocabulary (`saves`, `quotes`, etc.). See `PostMetricType` for the full
  catalog including deprecated values.
  """
  type: PostMetricType!

  """The unit (count vs percentage) of `value`."""
  unit: PostMetricUnit!

  """
  The metric value. Defaults to 0 when the network did not report the metric.
  """
  value: Float!
}

