"""
Marks an operation as exempt from the org-enforced-2FA server gate.

The forced-setup flow needs to read the viewer's own account/organization
state (`account` query) and complete 2FA setup (`twoFactorSetup`,
`twoFactorConfirm` mutations) without being blocked by the gate the user is
trying to satisfy.

Semantics:
- Applied at the operation top-level field.
- The schema directive wrapper bypasses the entire request when EVERY top-level
  field carries this directive — including nested field traversal.
- Read access to the viewer's data via nested fields is intentional;
  mutations not in the allow-list remain gated.
- The directive must NOT be applied to anything that writes business state
  outside the 2FA-setup flow.

SECURITY NOTE — `Query.account` bypass scope:

  `Query.account` returns the viewer's `Account`, which exposes their
  membership graph (organizations, channels, billing, members) via nested
  fields. While the gate is bypassed for this operation, ALL of those
  nested fields are reachable to a non-2FA member during forced setup.
  This is the accepted Alpha trade-off — the forced-setup page needs the
  org list to know it's in an enforcing org, and writes are still gated
  by every non-bypassed mutation. Follow-up (post-Alpha) is to carve a
  narrower `viewerForcedSetup` query that exposes only the fields the
  redirect needs.
"""
directive @bypassOrg2FAGate on FIELD_DEFINITION

