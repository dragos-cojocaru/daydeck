  """
  updatePostTemplate(
    """Input for updating a post template."""
    input: UpdatePostTemplateInput!
  ): UpdatePostTemplatePayload!

  """Create a new idea with the given content and metadata"""
  createIdea(
    """Input to create an idea"""
    input: CreateIdeaInput!
